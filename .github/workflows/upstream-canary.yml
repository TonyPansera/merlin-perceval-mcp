name: Upstream canary

# This server holds no copy of the documentation it serves, so it cannot go stale — but it
# does depend on how upstream publishes. These live tests are the tripwire for that: if the
# documentation sites stop publishing objects.inv, searchindex.js or _sources, or stop naming
# the current version on their landing page, this job fails and files an issue.

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - name: Run live tests against upstream
        run: pytest -q -m network

      - name: Open an issue when upstream has moved
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Upstream layout check failed';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              'The weekly live tests against the MerLin and Perceval documentation sites failed.',
              '',
              'Something upstream has probably changed: a moved version directory, a build that no',
              'longer publishes `objects.inv`, `searchindex.js` or `_sources/`, or a landing page that',
              'no longer names the current version.',
              '',
              `Run: ${run}`,
            ].join('\n');

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'upstream',
            });
            const open = existing.data.find((issue) => issue.title === title);
            if (open) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['upstream', 'bug'],
              });
            }
